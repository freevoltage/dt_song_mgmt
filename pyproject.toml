[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elektron-digi-song-mode-manager"
version = "0.1.0"
description = "Manage Digitakt II and Digitone II song mode projects"
requires-python = ">=3.10"
dependencies = ["textual>=1.0"]

[project.scripts]
dsm = "dt_song_mgmt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dt_song_mgmt"]

[tool.hatch.build.targets.wheel.force-include]
"src/dt_song_mgmt/static/editor.html" = "dt_song_mgmt/static/editor.html"

[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "SPEC.md", "pyproject.toml"]
