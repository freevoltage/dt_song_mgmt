<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Song Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { color-scheme: dark; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            background: #0a0a0a;
            color: #e6e6e6;
            overflow-x: hidden;
        }
        header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: #111;
            border-bottom: 1px solid #2a2a2a;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        h1 { font-size: 12px; font-weight: 650; }
        .project-name { color: #8c8c8c; font-size: 11px; }
        .header-actions { margin-left: auto; display: flex; gap: 6px; }
        button {
            background: #1a1a1a;
            color: #e6e6e6;
            border: 1px solid #2c2c2c;
            padding: 4px 10px;
            font: 10px ui-monospace, monospace;
            cursor: pointer;
            border-radius: 2px;
        }
        button:hover { border-color: #4a4a4a; background: #222; }
        button.primary { background: #d4652f; color: #1a0c06; border-color: #d4652f; }
        button.primary:hover { background: #e0753f; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button.active { background: #2a1f15; border-color: #d4652f; }
        
        .main-layout {
            display: flex;
            height: calc(100vh - 37px);
        }
        .pattern-panel {
            width: 280px;
            background: #111;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .song-panel {
            width: 220px;
            background: #111;
            border-right: 1px solid #2a2a2a;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .panel-header {
            padding: 6px 10px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f0f0f;
        }
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }
        .song-panel-card {
            padding: 6px 8px;
            margin-bottom: 4px;
            background: #151515;
            border: 1px solid #252525;
            border-radius: 2px;
            cursor: grab;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .song-panel-card.dragging { opacity: 0.4; }
        .song-panel-card.dragover { border-color: #d4652f; }
        .song-panel-slot { color: #8c8c8c; width: 18px; }
        .song-panel-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .pattern-panel.collapsed { width: 32px; }
        .pattern-panel.collapsed .panel-content { display: none; }
        .pattern-panel.collapsed .panel-header span { display: none; }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
            background: #151515;
            border-bottom: 1px solid #2a2a2a;
            font-weight: 650;
        }
        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
        }
        .panel-content::-webkit-scrollbar { width: 6px; }
        .panel-content::-webkit-scrollbar-track { background: #0a0a0a; }
        .panel-content::-webkit-scrollbar-thumb { background: #2a2a2a; }
        
        .bank-section { margin-bottom: 10px; }
        .bank-label {
            color: #8c8c8c;
            font-size: 10px;
            padding: 2px 4px;
            margin-bottom: 3px;
        }
        .pattern-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .pattern-card {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 6px;
            background: #151515;
            border: 1px solid #252525;
            border-radius: 2px;
            cursor: grab;
            user-select: none;
        }
        .pattern-card:hover { border-color: #3a3a3a; background: #1a1a1a; }
        .pattern-card.dragging { opacity: 0.4; }
        .pattern-card.empty { opacity: 0.4; }
        .pattern-label { color: #d4652f; font-weight: 650; min-width: 24px; }
        .pattern-name {
            flex: 1;
            color: #c0c0c0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 10px;
        }
        .pattern-name.empty { color: #5a5a5a; font-style: italic; }
        .pattern-refs { color: #6a6a6a; font-size: 9px; }
        .pattern-actions { display: flex; gap: 2px; }
        .pattern-actions button { padding: 1px 4px; font-size: 9px; }
        
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }
        .content::-webkit-scrollbar { width: 8px; }
        .content::-webkit-scrollbar-track { background: #0a0a0a; }
        .content::-webkit-scrollbar-thumb { background: #2a2a2a; }
        
        .songs-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 1100px;
        }
        .song-card {
            background: #111;
            border: 1px solid #252525;
            border-radius: 3px;
            overflow: hidden;
        }
        .song-card.empty { opacity: 0.5; }
        .song-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 12px;
            background: #151515;
            border-bottom: 1px solid #252525;
        }
        .song-slot { color: #8c8c8c; font-weight: 650; }
        .song-name {
            flex: 1;
            font-weight: 650;
            cursor: pointer;
            font-size: 12px;
        }
        .song-name:hover { color: #d4652f; }
        .song-meta { color: #6e6e6e; font-size: 10px; }
        .song-actions { display: flex; gap: 4px; }
        .song-actions button { padding: 3px 8px; font-size: 10px; }
        
        .rows-table {
            width: 100%;
            border-collapse: collapse;
        }
        .rows-table th {
            text-align: left;
            padding: 4px 8px;
            background: #0f0f0f;
            color: #7a7a7a;
            font-weight: 500;
            font-size: 9px;
            border-bottom: 1px solid #252525;
        }
        .rows-table td {
            padding: 4px 8px;
            border-bottom: 1px solid #181818;
        }
        .rows-table tr:hover { background: #161616; }
        .rows-table tr.row-selected { background: #251a12; }
        .rows-table tr.row-selected:hover { background: #2d2016; }
        .rows-table tr.sortable-ghost { opacity: 0.3; }
        .rows-table tr.sortable-drag { background: #1f1f1f; }
        .drag-handle { cursor: move; color: #4a4a4a; }
        .row-idx { color: #6a6a6a; }
        .row-checkbox { cursor: pointer; }
        .pattern-drop {
            background: #0f0f0f;
            color: #e6e6e6;
            border: 1px solid #2c2c2c;
            padding: 2px 6px;
            font: 11px ui-monospace, monospace;
            min-width: 100px;
            text-align: left;
        }
        .pattern-drop.dragover { border-color: #d4652f; background: #251a12; }
        .num-input {
            background: #0f0f0f;
            color: #e6e6e6;
            border: 1px solid #2c2c2c;
            padding: 2px 4px;
            font: 11px ui-monospace, monospace;
            width: 48px;
        }
        .mute-pads {
            display: flex;
            gap: 1px;
            flex-wrap: wrap;
            max-width: 100px;
        }
        .mute-pad {
            width: 11px;
            height: 11px;
            border-radius: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
        }
        .mute-pad.live { background: #d4652f; color: #1a0c06; }
        .mute-pad.muted { background: #252525; color: #555; }
        
        .bulk-toolbar {
            position: fixed;
            bottom: 0;
            left: 280px;
            right: 0;
            background: #111;
            border-top: 2px solid #d4652f;
            display: none;
            z-index: 100;
        }
        .bulk-toolbar.active { display: block; }
        .pattern-panel.collapsed + .content + .bulk-toolbar { left: 32px; }
        .bulk-toolbar-content {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 16px;
            flex-wrap: wrap;
        }
        .bulk-toolbar .info { color: #e6e6e6; font-weight: 650; font-size: 11px; }
        .bulk-toolbar .separator { color: #333; }
        .bulk-group { display: flex; align-items: center; gap: 5px; }
        .bulk-group label { color: #8c8c8c; font-size: 10px; }
        .bulk-select {
            background: #0f0f0f;
            color: #e6e6e6;
            border: 1px solid #2c2c2c;
            padding: 3px 5px;
            font: 10px ui-monospace, monospace;
        }
        .bulk-input {
            background: #0f0f0f;
            color: #e6e6e6;
            border: 1px solid #2c2c2c;
            padding: 3px 5px;
            font: 10px ui-monospace, monospace;
            width: 50px;
        }
        .bulk-btn { padding: 3px 7px; font-size: 10px; }
        
        .diff-panel {
            position: fixed;
            bottom: 36px;
            left: 280px;
            right: 0;
            background: #111;
            border-top: 2px solid #d4652f;
            max-height: 160px;
            overflow-y: auto;
            display: none;
            z-index: 99;
        }
        .pattern-panel.collapsed + .content + .bulk-toolbar + .diff-panel { left: 32px; }
        .diff-panel.active { display: block; }
        .diff-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 16px;
            background: #151515;
        }
        .diff-content { padding: 6px 16px; }
        .diff-item { color: #8c8c8c; padding: 1px 0; font-size: 10px; }
        
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
        }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content {
            background: #111;
            border: 1px solid #3a3a3a;
            padding: 16px;
            max-width: 400px;
            width: 90%;
        }
        .modal-header { font-weight: 650; margin-bottom: 10px; }
        .modal-body { margin-bottom: 14px; color: #b0b0b0; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
    </style>
</head>
<body>
    <header>
        <h1 id="appTitle">Song Editor</h1>
        <span class="project-name" id="projectName"></span>
        <div class="header-actions">
            <button id="togglePatternBtn" onclick="togglePatternPanel()">Hide Patterns</button>
            <button onclick="undo()" id="undoBtn" disabled>Undo</button>
            <button onclick="redo()" id="redoBtn" disabled>Redo</button>
            <button onclick="exportArrangement()">Export JSON</button>
            <button onclick="importArrangement()">Import JSON</button>
            <button onclick="showImportSong()">Import Song from Project</button>
            <button onclick="showHelp()">HELP</button>
            <button onclick="reload()">Reload</button>
            <button onclick="previewChanges()">Preview Changes</button>
            <button class="primary" id="applyBtn" onclick="applyChanges()" disabled>Apply Changes</button>
        </div>
    </header>
    
    <div class="main-layout">
        <aside id="songPanel" class="song-panel">
            <div class="panel-header">
                <span>Song Slots</span>
            </div>
            <div class="panel-content" id="songPanelContent"></div>
        </aside>
        <aside id="patternPanel" class="pattern-panel">
            <div class="panel-header">
                <span>Pattern Manager</span>
            </div>
            <div class="panel-content" id="patternPanelContent"></div>
        </aside>
        
        <main class="content">
            <div class="songs-list" id="songsList"></div>
        </main>
    </div>
    
    <div class="bulk-toolbar" id="bulkToolbar">
        <div class="bulk-toolbar-content">
            <span class="info"><span id="bulkCount">0</span> rows selected</span>
            <span class="separator">|</span>
            <div class="bulk-group">
                <label>Pattern:</label>
                <select class="bulk-select" id="bulkPatternSelect"></select>
                <button class="bulk-btn" onclick="applyBulkPattern()">Apply</button>
            </div>
            <span class="separator">|</span>
            <div class="bulk-group">
                <label>Repeat:</label>
                <input class="bulk-input" type="number" id="bulkRepeat" min="1" max="99">
                <button class="bulk-btn" onclick="applyBulkUpdate('repeat', 'bulkRepeat')">Apply</button>
            </div>
            <div class="bulk-group">
                <label>Length:</label>
                <input class="bulk-input" type="number" id="bulkLength" min="1" max="1024">
                <button class="bulk-btn" onclick="applyBulkUpdate('length', 'bulkLength')">Apply</button>
            </div>
            <div class="bulk-group">
                <label>BPM:</label>
                <input class="bulk-input" type="number" id="bulkBpm" min="1" max="300">
                <button class="bulk-btn" onclick="applyBulkUpdate('bpm', 'bulkBpm')">Apply</button>
            </div>
            <span class="separator">|</span>
            <button class="bulk-btn" onclick="deleteSelectedRows()">Delete Selected</button>
            <button class="bulk-btn" onclick="clearSelection()">Clear Selection</button>
        </div>
    </div>
    
    <div class="diff-panel" id="diffPanel">
        <div class="diff-header">
            <span>Changes Preview</span>
            <button onclick="hideDiff()">Close</button>
        </div>
        <div class="diff-content" id="diffContent"></div>
    </div>
    
    <div id="patternMoveModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Pattern Action</div>
            <div class="modal-body" id="patternMoveBody"></div>
            <div class="modal-actions">
                <button onclick="closePatternModal()">Cancel</button>
            </div>
        </div>
    </div>
    
    <script>
        let state = null;
        let patterns = [];
        let operations = [];
        let undoStack = [];
        let redoStack = [];
        let selectedRows = new Set();
        let lastClickedKey = null;
        let pendingPatternMove = null;
        
        async function loadState() {
            const res = await fetch('/api/state');
            state = await res.json();
            const pres = await fetch('/api/patterns');
            const pdata = await pres.json();
            patterns = pdata.patterns;
            render();
        }
        
        function togglePatternPanel() {
            const panel = document.getElementById('patternPanel');
            const btn = document.getElementById('togglePatternBtn');
            panel.classList.toggle('collapsed');
            btn.textContent = panel.classList.contains('collapsed') ? 'Show Patterns' : 'Hide Patterns';
            btn.classList.toggle('active');
        }
        
        function renderSongPanel() {
            const content = document.getElementById('songPanelContent');
            content.innerHTML = '';
            if (!state) return;
            state.songs.forEach(song => {
                const card = document.createElement('div');
                card.className = 'song-panel-card';
                card.draggable = true;
                card.dataset.slot = song.slot;
                card.innerHTML = `<span class="song-panel-slot">${song.slot.toString().padStart(2,'0')}</span><span class="song-panel-name">${escapeHtml(song.name)}</span>`;
                card.addEventListener('dragstart', e => {
                    e.dataTransfer.setData('songslot', song.slot);
                    card.classList.add('dragging');
                });
                card.addEventListener('dragend', e => { card.classList.remove('dragging'); });
                card.addEventListener('dragover', e => { e.preventDefault(); card.classList.add('dragover'); });
                card.addEventListener('dragleave', e => { card.classList.remove('dragover'); });
                card.addEventListener('drop', e => {
                    e.preventDefault();
                    card.classList.remove('dragover');
                    const src = parseInt(e.dataTransfer.getData('songslot'));
                    const dst = song.slot;
                    if (isNaN(src) || src === dst) return;
                    undoStack.push(JSON.parse(JSON.stringify(operations))); redoStack = [];
                    operations.push({type: 'swap_songs', slot_a: src, slot_b: dst});
                    updateUndoRedo();
                    // Swap locally for immediate feedback
                    const s1 = state.songs.find(x => x.slot === src);
                    const s2 = state.songs.find(x => x.slot === dst);
                    if (s1 && s2) {
                        const tmp = {name: s1.name, rows: JSON.parse(JSON.stringify(s1.rows)), row_count: s1.row_count, default_bpm: s1.default_bpm};
                        s1.name = s2.name; s1.rows = JSON.parse(JSON.stringify(s2.rows)); s1.row_count = s2.row_count; s1.default_bpm = s2.default_bpm;
                        s2.name = tmp.name; s2.rows = tmp.rows; s2.row_count = tmp.row_count; s2.default_bpm = tmp.default_bpm;
                    }
                    document.getElementById('applyBtn').disabled = false;
                    render();
                });
                content.appendChild(card);
            });
        }
        function render() {
            const device = state.device || 'DT2';
            const deviceTitle = device === 'DN2' ? 'Digitone II Song Editor' : 'Digitakt II Song Editor';
            document.title = deviceTitle;
            document.getElementById('appTitle').textContent = deviceTitle;
            document.getElementById('projectName').textContent = state.project_name;
            
            // Bulk pattern select
            const bulkPatSel = document.getElementById('bulkPatternSelect');
            bulkPatSel.innerHTML = '<option value="">-- Select pattern --</option>' + patterns.map(p => `<option value="${p.index}">${p.label}${p.name && p.name !== p.label ? ' - ' + p.name.substring(0,20) : ''}</option>`).join('');
            
            // Song panel
            renderSongPanel();
            // Pattern panel
            renderPatternPanel();
            
            // Songs list
            const list = document.getElementById('songsList');
            list.innerHTML = '';
            state.songs.forEach(song => {
                const card = document.createElement('div');
                card.className = 'song-card' + (song.row_count === 0 ? ' empty' : '');
                card.innerHTML = `
                    <div class="song-header">
                        <span class="song-slot">${song.slot.toString().padStart(2,'0')}</span>
                        <span class="song-name" onclick="renameSong(${song.slot})">${escapeHtml(song.name)}</span>
                        <span class="song-meta">${song.row_count} rows${song.default_bpm ? ' · ' + song.default_bpm + ' BPM' : ''}</span>
                        <div class="song-actions">
                            <button onclick="selectAllInSong(${song.slot})">Select All</button>
                            <button onclick="clearSong(${song.slot})">Clear</button>
                        </div>
                    </div>
                    <table class="rows-table" id="rows-${song.slot}">
                        <thead>
                            <tr>
                                <th></th><th></th><th>#</th><th>Pattern</th><th>Rep</th><th>BPM</th><th>Len</th><th>Mutes</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                `;
                list.appendChild(card);
                
                const tbody = card.querySelector('tbody');
                song.rows.forEach((row, idx) => {
                    const tr = document.createElement('tr');
                    tr.dataset.rowIdx = idx;
                    tr.dataset.slot = song.slot;
                    const key = song.slot + ':' + idx;
                    if (selectedRows.has(key)) tr.classList.add('row-selected');
                    const pat = patterns.find(p => p.index === row.pattern);
                    tr.innerHTML = `
                        <td class="drag-handle">⋮⋮</td>
                        <td><input type="checkbox" class="row-checkbox" data-key="${key}" ${selectedRows.has(key) ? 'checked' : ''} onclick="toggleRowSelection(event, ${song.slot}, ${idx})"></td>
                        <td class="row-idx">${idx+1}</td>
                        <td><button class="pattern-drop" draggable="false" ondragover="rowDragOver(event)" ondrop="rowDrop(event, ${song.slot}, ${idx})" title="${pat ? pat.name : ''}">${pat ? pat.label + (pat.name && pat.name !== pat.label ? ' · ' + pat.name.substring(0,12) : '') : row.pattern_label}</button></td>
                        <td><input class="num-input" type="number" value="${row.repeat}" min="1" max="99" onchange="updateRowField(${song.slot}, ${idx}, 'repeat', this.value)"></td>
                        <td><input class="num-input" type="number" value="${row.bpm_raw === 0 ? '' : Math.round(row.bpm_raw/120)}" placeholder="inh" onchange="updateRowFieldBpm(${song.slot}, ${idx}, this.value)"></td>
                        <td><input class="num-input" type="number" value="${row.length}" min="1" max="1024" onchange="updateRowField(${song.slot}, ${idx}, 'length', this.value)"></td>
                        <td><div class="mute-pads">${renderMutePads(row.mute_mask)}</div></td>
                    `;
                    tbody.appendChild(tr);
                });
                
                new Sortable(tbody, {
                    handle: '.drag-handle',
                    animation: 150,
                    onEnd: function(evt) {
                        reorderRows(song.slot, tbody);
                    }
                });
            });
            updateBulkToolbar();
        }
        
        function toggleBank(bank, el) {
            const list = document.getElementById('bank-' + bank);
            if (!list) return;
            if (list.style.display === 'none') {
                list.style.display = 'block';
                el.textContent = '▾ Bank ' + bank;
            } else {
                list.style.display = 'none';
                el.textContent = '▸ Bank ' + bank;
            }
        }
        function renderPatternPanel() {
            const content = document.getElementById('patternPanelContent');
            content.innerHTML = '';
            const banks = ['A','B','C','D','E','F','G','H'];
            banks.forEach(bank => {
                const section = document.createElement('div');
                section.className = 'bank-section';
                section.innerHTML = `<div class="bank-label" style="cursor:pointer" onclick="toggleBank('${bank}', this)">▾ Bank ${bank}</div><div class="pattern-list" id="bank-${bank}"></div>`;
                content.appendChild(section);
                const list = section.querySelector('.pattern-list');
                patterns.filter(p => p.label.startsWith(bank)).forEach(pat => {
                    const card = document.createElement('div');
                    card.className = 'pattern-card' + (pat.ref_count === 0 ? ' empty' : '');
                    card.draggable = true;
                    card.dataset.patIdx = pat.index;
                    card.innerHTML = `
                        <span class="pattern-label">${pat.label}</span>
                        <span class="pattern-name ${pat.name ? '' : 'empty'}" title="${escapeHtml(pat.name || '')}">${pat.name || '(unnamed)'}</span>
                        <span class="pattern-refs">${pat.ref_count}</span>
                        <div class="pattern-actions">
                            <button onclick="renamePattern(${pat.index}, event)">✎</button>
                        </div>
                    `;
                    card.addEventListener('dragstart', e => {
                        e.dataTransfer.setData('pattern', pat.index);
                        card.classList.add('dragging');
                    });
                    card.addEventListener('dragend', e => {
                        card.classList.remove('dragging');
                    });
                    card.addEventListener('dragover', e => {
                        e.preventDefault();
                        card.style.borderColor = '#d4652f';
                    });
                    card.addEventListener('dragleave', e => {
                        card.style.borderColor = '#252525';
                    });
                    card.addEventListener('drop', e => {
                        e.preventDefault();
                        card.style.borderColor = '#252525';
                        const srcIdx = parseInt(e.dataTransfer.getData('pattern'));
                        if (srcIdx !== pat.index) {
                            patternDropOnPattern(srcIdx, pat.index);
                        }
                    });
                    list.appendChild(card);
                });
            });
        }
        
        function patternDropOnPattern(srcIdx, dstIdx) {
            const src = patterns.find(p => p.index === srcIdx);
            const dst = patterns.find(p => p.index === dstIdx);
            const body = document.getElementById('patternMoveBody');
            body.innerHTML = `
                <div><strong>${src.label}</strong> ${src.name || '(unnamed)'} → <strong>${dst.label}</strong> ${dst.name || '(unnamed)'}</div><br>
                <div style="color:#8c8c8c">Pattern ${dst.label} has ${dst.ref_count} references</div>
            `;
            const modal = document.getElementById('patternMoveModal');
            modal.classList.add('active');
            pendingPatternMove = {srcIdx, dstIdx};
            const actions = modal.querySelector('.modal-actions');
            actions.innerHTML = `
                <button onclick="doPatternMove('copy')">Copy</button>
                <button onclick="doPatternMove('move')">Move (retarget refs)</button>
                <button onclick="doPatternMove('swap')">Swap</button>
                <button onclick="closePatternModal()">Cancel</button>
            `;
        }
        
        function closePatternModal() {
            document.getElementById('patternMoveModal').classList.remove('active');
            pendingPatternMove = null;
        }
        
        async function doPatternMove(action) {
            if (!pendingPatternMove) return;
            const {srcIdx, dstIdx} = pendingPatternMove;
            let url, body;
            if (action === 'copy') { url = '/api/patterns/copy'; body = {src_idx: srcIdx, dst_idx: dstIdx}; }
            else if (action === 'move') { url = '/api/patterns/move'; body = {src_idx: srcIdx, dst_idx: dstIdx, also_retarget: true}; }
            else if (action === 'swap') { url = '/api/patterns/swap'; body = {pat_a: srcIdx, pat_b: dstIdx}; }
            closePatternModal();
            if (!confirm('Apply pattern change to project? A backup will be created.')) return;
            const res = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
            const data = await res.json();
            if (data.success) {
                alert('Done. Backup: ' + data.backup);
                loadState();
            } else {
                alert('Error: ' + data.error);
            }
        }
        
        function rowDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('dragover'); }
        function rowDrop(e, slot, rowIdx) {
            e.preventDefault();
            e.currentTarget.classList.remove('dragover');
            const patIdx = parseInt(e.dataTransfer.getData('pattern'));
            if (!isNaN(patIdx)) {
                undoStack.push(JSON.parse(JSON.stringify(operations))); redoStack = [];
                operations.push({type: 'retarget', slot: slot, rows: [rowIdx], to_pattern: patIdx});
                updateUndoRedo();
                document.getElementById('applyBtn').disabled = false;
                const pat = patterns.find(p => p.index === patIdx);
                if (state && state.songs) {
                    const song = state.songs.find(x => x.slot === slot);
                    if (song && song.rows && song.rows[rowIdx]) {
                        song.rows[rowIdx].pattern = patIdx;
                        song.rows[rowIdx].pattern_label = pat ? ((pat.name && pat.name !== pat.label) ? pat.label + ' · ' + pat.name.substring(0,12) : pat.label) : String(patIdx);
                    }
                }
                render();
            }
        }
        
        async function renamePattern(patIdx, event) {
            event.stopPropagation();
            const pat = patterns.find(p => p.index === patIdx);
            const name = prompt('Rename pattern ' + pat.label + ':', pat.name);
            if (name !== null) {
                if (!confirm('Rename pattern in project? A backup will be created.')) return;
                const res = await fetch('/api/patterns/rename', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({pat_idx: patIdx, name: name})});
                const data = await res.json();
                if (data.success) { alert('Done. Backup: ' + data.backup); loadState(); } else { alert('Error: ' + data.error); }
            }
        }
        
        function renderMutePads(mask) {
            let html = '';
            for (let t = 1; t <= 8; t++) {
                const muted = !(mask & (1 << (t-1)));
                html += `<span class="mute-pad ${muted ? 'muted' : 'live'}">${t}</span>`;
            }
            html += '<br style="flex-basis:100%">';
            for (let t = 9; t <= 16; t++) {
                const muted = !(mask & (1 << (t-1)));
                html += `<span class="mute-pad ${muted ? 'muted' : 'live'}">${t}</span>`;
            }
            return html;
        }
        
        function toggleRowSelection(event, slot, rowIdx) {
            event.stopPropagation();
            const key = slot + ':' + rowIdx;
            if (event.shiftKey && lastClickedKey) {
                const [lastSlot, lastIdx] = lastClickedKey.split(':').map(Number);
                if (lastSlot === slot) {
                    const start = Math.min(lastIdx, rowIdx);
                    const end = Math.max(lastIdx, rowIdx);
                    for (let i = start; i <= end; i++) selectedRows.add(slot + ':' + i);
                } else { selectedRows.add(key); }
            } else {
                if (selectedRows.has(key)) selectedRows.delete(key);
                else selectedRows.add(key);
            }
            lastClickedKey = key;
            render();
        }
        
        function selectAllInSong(slot) {
            state.songs[slot].rows.forEach((_, idx) => selectedRows.add(slot + ':' + idx));
            render();
        }
        
        function clearSelection() { selectedRows.clear(); render(); }
        function updateBulkToolbar() {
            const toolbar = document.getElementById('bulkToolbar');
            document.getElementById('bulkCount').textContent = selectedRows.size;
            if (selectedRows.size > 0) toolbar.classList.add('active');
            else toolbar.classList.remove('active');
        }
        
        function applyBulkPattern() {
            const sel = document.getElementById('bulkPatternSelect');
            if (!sel.value) { alert('Select a pattern first'); return; }
            const patternIdx = parseInt(sel.value);
            const pat = patterns.find(p => p.index === patternIdx);
            if (selectedRows.size === 0) { alert('Select rows first'); return; }
            const groups = {};
            selectedRows.forEach(key => { 
                const parts = key.split(':'); 
                const slot = parseInt(parts[0]); 
                const rowIdx = parseInt(parts[1]); 
                if (!groups[slot]) groups[slot] = []; 
                groups[slot].push(rowIdx); 
            });
            Object.keys(groups).forEach(slotKey => {
                const s = parseInt(slotKey);
                const rows = groups[slotKey].slice();
                undoStack.push(JSON.parse(JSON.stringify(operations))); redoStack = []; operations.push({type: 'retarget', slot: s, rows: rows, to_pattern: patternIdx}); updateUndoRedo();
                if (state && state.songs) {
                    const song = state.songs.find(x => x.slot === s);
                    if (song) {
                        rows.forEach(rowIdx => {
                            if (song.rows && song.rows[rowIdx]) {
                                song.rows[rowIdx].pattern = patternIdx;
                                if (pat) {
                                    song.rows[rowIdx].pattern_label = (pat.name && pat.name !== pat.label) ? pat.label + ' · ' + pat.name.substring(0,12) : pat.label;
                                } else {
                                    song.rows[rowIdx].pattern_label = String(patternIdx);
                                }
                            }
                        });
                    }
                }
            });
            selectedRows.clear();
            document.getElementById('applyBtn').disabled = false;
            sel.value = '';
            render();
        }
        
        function applyBulkUpdate(field, inputId) {
            const input = document.getElementById(inputId);
            let value = input.value === '' ? null : input.value;
            if (value === null) return;
            if (field === 'bpm') { value = parseFloat(value) * 120; field = 'bpm_raw'; }
            else value = parseInt(value);
            const groups = {};
            selectedRows.forEach(key => { const [slot, rowIdx] = key.split(':').map(Number); if (!groups[slot]) groups[slot] = []; groups[slot].push(rowIdx); });
            Object.keys(groups).forEach(slot => {
                operations.push({type: 'update_rows', slot: parseInt(slot), rows: groups[slot], updates: {[field]: value}});
            });
            document.getElementById('applyBtn').disabled = false;
            input.value = '';
        }
        
        function deleteSelectedRows() {
            if (!confirm('Delete selected rows?')) return;
            const groups = {};
            selectedRows.forEach(key => { const [slot, rowIdx] = key.split(':').map(Number); if (!groups[slot]) groups[slot] = []; groups[slot].push(rowIdx); });
            Object.keys(groups).forEach(slot => {
                undoStack.push(JSON.parse(JSON.stringify(operations))); redoStack = [];
                operations.push({type: 'delete_rows', slot: parseInt(slot), rows: groups[slot].sort((a,b) => b-a)});
                updateUndoRedo();
            });
            selectedRows.clear();
            document.getElementById('applyBtn').disabled = false;
            render();
        }
        
        function changePattern(slot, rowIdx, patternIdx) {
            operations.push({type: 'retarget', slot: slot, rows: [rowIdx], to_pattern: parseInt(patternIdx)});
            document.getElementById('applyBtn').disabled = false;
        }
        function updateRowField(slot, rowIdx, field, value) {
            if (value === '') return;
            operations.push({type: 'update_rows', slot: slot, rows: [rowIdx], updates: {[field]: parseInt(value)}});
            document.getElementById('applyBtn').disabled = false;
        }
        function updateRowFieldBpm(slot, rowIdx, value) {
            if (value === '') operations.push({type: 'update_rows', slot: slot, rows: [rowIdx], updates: {bpm_raw: 0}});
            else operations.push({type: 'update_rows', slot: slot, rows: [rowIdx], updates: {bpm_raw: parseFloat(value) * 120}});
            document.getElementById('applyBtn').disabled = false;
        }
        function reorderRows(slot, tbody) {
            const newOrder = [];
            tbody.querySelectorAll('tr').forEach(tr => { newOrder.push(parseInt(tr.dataset.rowIdx)); });
            operations.push({type: 'reorder', slot: slot, new_order: newOrder});
            document.getElementById('applyBtn').disabled = false;
        }
        function renameSong(slot) {
            const name = prompt('Enter new song name:');
            if (name) {
                operations.push({type: 'rename_song', slot: slot, name: name});
                document.getElementById('applyBtn').disabled = false;
                render();
            }
        }
        function clearSong(slot) {
            if (confirm('Clear all rows from this song?')) {
                operations.push({type: 'clear_song', slot: slot});
                document.getElementById('applyBtn').disabled = false;
            }
        }
        
        async function previewChanges() {
            const res = await fetch('/api/preview', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({operations: operations})});
            const data = await res.json();
            const panel = document.getElementById('diffPanel');
            const content = document.getElementById('diffContent');
            content.innerHTML = '';
            if (!data.changes || data.changes.length === 0) content.innerHTML = '<div class="diff-item">No changes</div>';
            else data.changes.forEach(c => { content.innerHTML += `<div class="diff-item">Slot ${c.slot.toString().padStart(2,'0')} '${escapeHtml(c.name_old)}' (${c.rows_old} rows) → '${escapeHtml(c.name_new)}' (${c.rows_new} rows)</div>`; });
            panel.classList.add('active');
        }
        function hideDiff() { document.getElementById('diffPanel').classList.remove('active'); }
        
        async function applyChanges() {
            if (!confirm('Apply changes to project file? A backup will be created.')) return;
            const res = await fetch('/api/apply', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({operations: operations})});
            const data = await res.json();
            if (data.success) {
                alert('Changes applied successfully! Backup: ' + data.backup);
                operations = []; selectedRows.clear(); document.getElementById('applyBtn').disabled = true; hideDiff();
                await loadState();
                render();
            } else { alert('Error: ' + data.error); }
        }
        function updateUndoRedo() {
            document.getElementById('undoBtn').disabled = undoStack.length === 0;
            document.getElementById('redoBtn').disabled = redoStack.length === 0;
        }
        function pushUndo() {
            undoStack.push(JSON.parse(JSON.stringify(operations)));
            redoStack = [];
            updateUndoRedo();
        }
        function undo() {
            if (undoStack.length === 0) return;
            redoStack.push(JSON.parse(JSON.stringify(operations)));
            operations = undoStack.pop();
            document.getElementById('applyBtn').disabled = operations.length === 0;
            selectedRows.clear();
            render();
            updateUndoRedo();
        }
        function redo() {
            if (redoStack.length === 0) return;
            undoStack.push(JSON.parse(JSON.stringify(operations)));
            operations = redoStack.pop();
            document.getElementById('applyBtn').disabled = operations.length === 0;
            selectedRows.clear();
            render();
            updateUndoRedo();
        }
        function exportArrangement() {
            if (!state) return;
            const data = {project: state.project_name, songs: state.songs};
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = (state.project_name || 'arrangement') + '.json';
            a.click();
            URL.revokeObjectURL(url);
        }
        function importArrangement() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json,application/json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        alert('Imported arrangement (preview not auto-applied). Use API or manual editing.');
                    } catch(ex) {
                        alert('Invalid JSON');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }
        let importSongState = {srcPath: '', songs: [], srcSlot: null, dstSlot: null};
        function showImportSong() {
            const modal = document.getElementById('importSongModal');
            document.getElementById('importSrcPath').value = '';
            document.getElementById('importSrcSongs').innerHTML = '<div style="color:#666">Load a project first</div>';
            document.getElementById('importDstSlot').innerHTML = '';
            if (state && state.songs) {
                state.songs.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.slot;
                    opt.textContent = s.slot.toString().padStart(2,'0') + ' ' + s.name + ' (' + s.row_count + ' rows)';
                    document.getElementById('importDstSlot').appendChild(opt);
                });
            }
            importSongState = {srcPath: '', songs: [], srcSlot: null, dstSlot: null};
            modal.classList.add('active');
        }
        function closeImportSong() {
            document.getElementById('importSongModal').classList.remove('active');
        }
        async function loadImportSource() {
            const path = document.getElementById('importSrcPath').value.trim();
            if (!path) { alert('Enter path to source .dt2prj'); return; }
            importSongState.srcPath = path;
            try {
                const res = await fetch('/api/list-project-songs', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({src_path: path})});
                const data = await res.json();
                if (data.error) { alert(data.error); return; }
                importSongState.songs = data.songs || [];
                const list = document.getElementById('importSrcSongs');
                list.innerHTML = '';
                importSongState.songs.forEach(s => {
                    const div = document.createElement('div');
                    div.className = 'import-song-item';
                    div.innerHTML = `<input type="radio" name="importSrc" value="${s.slot}"> <strong>${s.slot.toString().padStart(2,'0')}</strong> ${escapeHtml(s.name)} <span style="color:#666">(${s.row_count} rows)</span>`;
                    div.querySelector('input').onchange = e => { importSongState.srcSlot = parseInt(e.target.value); };
                    list.appendChild(div);
                });
            } catch(e) { alert(e.message); }
        }
        async function doImportSong() {
            if (!importSongState.srcPath || importSongState.srcSlot === null) { alert('Select source project and song'); return; }
            const dst = parseInt(document.getElementById('importDstSlot').value);
            if (isNaN(dst)) { alert('Select target slot'); return; }
            if (!confirm('Import song from source project? This will overwrite target slot. A backup will be created.')) return;
            try {
                const res = await fetch('/api/import-song', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({src_path: importSongState.srcPath, src_slot: importSongState.srcSlot, dst_slot: dst})});
                const data = await res.json();
                if (data.success) {
                    alert('Song imported. Backup: ' + data.backup);
                    closeImportSong();
                    await loadState();
                    render();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch(e) { alert(e.message); }
        }
        function showHelp() {
            const msg = `JSON Export / Import\n\n` +
                `Export JSON:\n` +
                `- Saves current view as JSON with project name and all songs/rows.\n` +
                `- Use this as a backup/snapshot or to share arrangements.\n\n` +
                `Import JSON:\n` +
                `- Currently loads the file for inspection only (not auto-applied).\n` +
                `- To actually apply changes, edit the project using the UI controls (drag/drop, retarget, bulk edit) and click Apply Changes.\n` +
                `- Apply Changes writes to the .dt2prj file with automatic .bak backup.\n\n` +
                `Import Song from Project:\n` +
                `- Copies entire song slot (all rows, mutes, repeats, etc.) from another .dt2prj into target slot.\n` +
                `- Patterns are referenced by index - if pattern numbers differ, retarget after import.\n\n` +
                `Tips:\n` +
                `- Drag patterns from Pattern Manager onto rows to retarget.\n` +
                `- Drag songs in Song Slots to swap positions.\n` +
                `- Use checkboxes + Shift for bulk selection.\n` +
                `- Cmd/Ctrl+Z / Cmd/Ctrl+Shift+Z for undo/redo.`;
            alert(msg);
        }
        function reload() { operations = []; undoStack = []; redoStack = []; selectedRows.clear(); document.getElementById('applyBtn').disabled = true; hideDiff(); loadState(); updateUndoRedo(); }
        function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text || ''; return div.innerHTML; }
        
        document.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT') return;
            if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
            if ((e.metaKey || e.ctrlKey) && (e.key === 'y' || (e.shiftKey && e.key === 'z'))) { e.preventDefault(); redo(); }
            if (e.key === 'Escape') { clearSelection(); }
        });
        loadState();
    </script>
    <div id="importSongModal" class="modal">
        <div class="modal-content" style="max-width:500px;">
            <div class="modal-header">Import Song from Another Project</div>
            <div class="modal-body">
                <div style="margin-bottom:8px;">
                    <label>Source .dt2prj path:</label><br>
                    <input id="importSrcPath" style="width:100%;background:#151515;color:#e6e6e6;border:1px solid #2a2a2a;padding:4px;font:10px monospace;" placeholder="/path/to/other.dt2prj">
                    <button style="margin-top:4px;" onclick="loadImportSource()">Load Songs</button>
                </div>
                <div style="margin-bottom:8px;">
                    <label>Source songs:</label>
                    <div id="importSrcSongs" style="max-height:150px;overflow-y:auto;border:1px solid #2a2a2a;background:#0f0f0f;padding:4px;"></div>
                </div>
                <div>
                    <label>Import into target slot:</label><br>
                    <select id="importDstSlot" style="background:#151515;color:#e6e6e6;border:1px solid #2a2a2a;padding:4px;"></select>
                </div>
                <div style="margin-top:8px;color:#8c8c8c;font-size:10px;">Patterns are referenced by index. Retarget if needed.</div>
            </div>
            <div class="modal-actions">
                <button onclick="doImportSong()">Import</button>
                <button onclick="closeImportSong()">Cancel</button>
            </div>
        </div>
    </div>
</body>
</html>
